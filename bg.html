<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link href="fonts/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body>





    <div class="bg-3">
        <div class="gradient-layer"></div>

        <div class="circles-container">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>

        <div class="glow-line vertical"></div>
        <div class="glow-line horizontal"></div>

        <div class="glass-card">
            <div class="card-content">
                <h2>System Active</h2>
                <p>Background layer identified as <strong>bg-3</strong>. All 3D rotations and light-leak animations are
                    synchronized.</p>
                <button class="tech-btn">Initialize</button>
            </div>
        </div>
    </div>



    <div class="go-top">
        <i class="bi bi-chevron-up"></i>
    </div>

    <script src="js/popper.min.js"></script>
    <script src="js/jquery-3.6.4.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/custom.js"></script>
</body>

</html>
